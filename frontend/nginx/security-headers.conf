# Security headers of every response (included where a location sets headers of its own, since
# nginx does not inherit add_header into such a location).
#
# CSP: the dashboard loads only its own scripts, styles and images. React sets inline styles
# through the CSSOM, which CSP does not restrict. Crawled content is shown as text only
# (ADR-0020).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
