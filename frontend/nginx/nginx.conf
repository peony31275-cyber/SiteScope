# SiteScope's public entry (Phase 11, ADR-0025): the dashboard's static files, and /api/
# forwarded to the API. Nothing else of the backend is reachable: GET /metrics, /docs and
# /openapi.json are the API's, outside /api/, and are not forwarded.
#
# Runs unprivileged on port 8080 (frontend/Dockerfile); the pid file and temp files live in
# /tmp, so the root filesystem may be read-only.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # The API accepts small JSON bodies only; slow clients are cut off.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One JSON line per request, to stdout. The path without its query string: search queries
    # stay out of the access log.
    log_format sitescope escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$sent_http_x_request_id"}';
    access_log /dev/stdout sitescope;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json
        image/svg+xml;

    # Abuse limits per client address (ADR-0024). Reads: 10 requests/s with bursts of 40 (a
    # dashboard page loads a dozen at once). Writes (POST and the like): 10 a minute; on a
    # read-only deployment the API refuses them anyway, and with an admin token this slows down
    # guessing. Excess requests get a 429 problem.
    limit_req_zone $binary_remote_addr zone=reads:10m rate=10r/s;
    map $request_method $write_client {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }
    limit_req_zone $write_client zone=writes:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # Below error_log's level: a rejection's error line would carry the request line, query
    # string included. The access log still records each 429, without the query string.
    limit_req_log_level info;
    limit_conn_log_level info;

    # Docker's DNS, so that the API's address follows its container (restarts, replicas).
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream sitescope_api {
        zone sitescope_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    # Empty by default. Behind a TLS proxy, real-ip.conf goes here (deploy/compose.https.yaml).
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        include /etc/nginx/snippets/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Same origin, so the API needs no CORS. Request IDs come from the API (X-Request-ID).
        location /api/ {
            limit_req zone=reads burst=40 nodelay;
            limit_req zone=writes burst=5 nodelay;
            limit_conn connections 20;
            error_page 429 = @rate_limited;

            proxy_pass http://sitescope_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # The client's address as nginx saw it (after real-ip, behind a TLS proxy): never a
            # client-supplied X-Forwarded-For.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location @rate_limited {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After 1 always;
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests from this address; retry in a moment.","code":"rate_limited"}';
        }

        # The backend's internal endpoints are never served here, not even as the dashboard.
        location ~ ^/(metrics|docs|redoc|openapi\.json|health)(/|$) {
            return 404;
        }

        # Hashed file names: cached for a year.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # The dashboard's routes are client-side: unknown paths get index.html, revalidated on
        # every visit.
        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
