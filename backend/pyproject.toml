[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescope-backend"
description = "SiteScope backend: REST API, scheduler, crawler and indexer workers."
requires-python = ">=3.13"
dynamic = ["version"]
# Lower bounds are the versions this phase was verified with.
dependencies = [
    "fastapi>=0.162",               # HTTP API framework
    "uvicorn[standard]>=0.54",      # ASGI server
    "pydantic-settings>=2.16",      # typed configuration from environment variables
    "sqlalchemy[asyncio]>=2.1.8",   # ORM/Core with asyncio support (pulls in greenlet)
    "asyncpg>=0.32",                # async PostgreSQL driver used by SQLAlchemy
    "alembic>=1.20",                # schema migrations
    "redis>=8.1",                   # official Redis client (redis.asyncio)
    "idna>=3.20",                   # IDNA 2008 / UTS #46 host names (stdlib codec is IDNA 2003)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",   # test runner
    "httpx2>=2.16",  # required by Starlette's TestClient (plain httpx is deprecated there)
    "ruff>=0.17",    # linter and formatter
    "mypy>=2.4",     # static type checker
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "C4",       # comprehensions
    "DTZ",      # naive datetimes (all timestamps must be timezone-aware UTC)
    "T20",      # stray print()
    "PT",       # pytest style
    "ASYNC",    # asyncio pitfalls
    "S",        # bandit security checks
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on assert (S101); tests use deliberately fake credentials (S105, S106).
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations directory would otherwise make the alembic package look local.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "alembic"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = [
    "integration: needs the real PostgreSQL and Redis services from backend/compose.yaml",
]
