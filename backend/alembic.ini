# Alembic configuration for SiteScope. Run from the backend/ directory, for example:
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#
# The database URL is built from the application settings (SITESCOPE_POSTGRES_* in backend/.env
# or the environment) by alembic/env.py. It is deliberately not stored in this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revision files are named <revision id>_<slug>.py. New revisions use explicit sequential IDs:
#   .\.venv\Scripts\python.exe -m alembic revision -m "describe change" --rev-id 0002
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
