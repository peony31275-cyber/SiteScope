# Behind Caddy only (deploy/compose.https.yaml): take the client's address from the
# X-Forwarded-For that Caddy sets, so that the rate limits and the logs see the client and not
# Caddy. Trusted only from private addresses, where Caddy's container is; a client on the
# internet never connects to nginx directly in this variant (nginx publishes no port).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
