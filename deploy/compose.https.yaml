# HTTPS for a public server: Caddy terminates TLS with a Let's Encrypt certificate for
# DEPLOY_DOMAIN and forwards everything to the frontend proxy. Use it on top of compose.yaml:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.https.yaml up -d --build --wait
#
# Needs a DNS record for DEPLOY_DOMAIN pointing at the server, and ports 80 and 443 open to the
# internet (the ACME HTTP and TLS-ALPN challenges). Caddy then publishes 80/443 (80 only
# redirects), and the frontend publishes nothing. The frontend trusts the X-Forwarded-For that
# Caddy sends: real-ip.conf, mounted here only.

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set DEPLOY_DOMAIN in deploy/.env}
      DEPLOY_ACME_EMAIL: ${DEPLOY_ACME_EMAIL:?set DEPLOY_ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3, which Caddy offers by default
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]

  frontend:
    ports: !reset []
    volumes:
      - ./nginx/real-ip.conf:/etc/nginx/conf.d/real-ip.conf:ro

volumes:
  # Certificates and the ACME account: keep them (Let's Encrypt limits new certificates).
  caddy-data:
  caddy-config:
