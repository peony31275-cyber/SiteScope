# The full verification (Phase 11, docs/ci.md): integration and fault suites against real
# PostgreSQL and Redis, the dashboard end to end against the real stack, and the containerized
# deployment, seeded and smoke-tested. On pushes to the main branch, every night, and on demand.
# Benchmarks never run here: they are measured on a known machine (docs/performance.md).
#
# Every credential below is a throwaway value for an ephemeral runner; no repository secret is
# used. The service jobs set the development services' passwords; the deployment job generates
# its own in deploy/.env (an environment variable would override them).
name: Full verification

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24.14.0"

jobs:
  services:
    name: Integration and fault tests (PostgreSQL 18, Redis 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SITESCOPE_POSTGRES_PASSWORD: ci-throwaway-postgres-password
      SITESCOPE_REDIS_PASSWORD: ci-throwaway-redis-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install the locked dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Start PostgreSQL and Redis (backend/compose.yaml, as in development)
        working-directory: backend
        run: docker compose up -d --wait
      - name: One migration head
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" = "1"
      - name: Integration and fault tests (skips are failures)
        working-directory: backend
        run: >-
          python -m pytest -m integration --require-services -p no:cacheprovider
          --junitxml=reports/integration.xml
      - name: Service logs
        if: ${{ failure() }}
        working-directory: backend
        run: docker compose logs --no-color --tail 300
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-report
          path: backend/reports/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Dashboard end to end (real stack, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SITESCOPE_POSTGRES_PASSWORD: ci-throwaway-postgres-password
      SITESCOPE_REDIS_PASSWORD: ci-throwaway-redis-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Install the dashboard and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start PostgreSQL and Redis
        working-directory: backend
        run: docker compose up -d --wait
      - name: The whole stack on a disposable database, then Playwright
        working-directory: backend
        env:
          E2E_BROWSER_CHANNEL: chromium
        run: python -m tests.dashboard_stack --e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      # Each process's JSON log (never a secret or a page body) and the dashboard's build and
      # preview output, kept in the temporary directory the stack prints.
      - name: Upload the stack's process logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-stack-logs
          path: /tmp/sitescope-dashboard-*/
          retention-days: 14
          if-no-files-found: ignore

  deployment:
    name: Containerized deployment (build, seed, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway deployment settings
        run: |
          cp deploy/.env.example deploy/.env
          for key in DEPLOY_POSTGRES_OWNER_PASSWORD SITESCOPE_POSTGRES_PASSWORD SITESCOPE_REDIS_PASSWORD; do
            sed -i "s/^${key}=.*/${key}=$(openssl rand -hex 24)/" deploy/.env
          done
      - name: Build and start the stack
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Seed the demo jobs (operator command, inside the stack)
        run: >-
          docker compose -f deploy/compose.yaml exec -T api
          python -m app.scheduler.admin seed-demo --base-url http://demo-site:8080 --wait 300
      - name: Smoke checks through the public entry
        run: python3 deploy/smoke.py http://127.0.0.1:8080 --read-only --demo
      - name: The application's database role is neither superuser nor owner
        run: |
          roles=$(docker compose -f deploy/compose.yaml exec -T postgres psql -U sitescope -d sitescope -tAc             "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = 'sitescope_app'")
          test "$roles" = "f"
          owner=$(docker compose -f deploy/compose.yaml exec -T postgres psql -U sitescope -d sitescope -tAc             "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner = 'sitescope_app'")
          test "$owner" = "0"
      - name: Container status and logs
        if: ${{ always() }}
        run: |
          docker compose -f deploy/compose.yaml ps -a
          docker compose -f deploy/compose.yaml logs --no-color --tail 200
      - name: Remove the stack and its volumes (ephemeral runner)
        if: ${{ always() }}
        run: docker compose -f deploy/compose.yaml down -v
