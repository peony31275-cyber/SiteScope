# The demo site's static server (demo-site/Dockerfile). Plain files, as a static file server
# serves them locally: a missing page is a 404 (the deliberate broken link), robots.txt is
# text/plain. Runs unprivileged on port 8080 with its temp files in /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format demo escape=json
        '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout demo;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # A directory without its slash is redirected to it, with a relative Location.
        absolute_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
