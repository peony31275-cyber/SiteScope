<body>
  <h1>Glossary</h1>
  <dl>
    <dt>Depth</dt><dd>The number of links between the seed and a page.</dd>
    <dt>Frontier</dt><dd>The URLs a crawl has admitted but not processed yet.</dd>
    <dt>Lease</dt><dd>A time-limited claim on one URL by one worker.</dd>
    <dt>Politeness</dt><dd>Limits that keep a crawler from overloading a site.</dd>
  </dl>
